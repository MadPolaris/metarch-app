# M3 向量读模型（kb_tenant_vector·pgvector HNSW cosine）——手写基建运行时配置。
# 消费方：PgVectorStore（vector.pg.*）＋OllamaEmbeddingClient（vector.embedding.*）
# （app/net/imadz/metarch/infrastructure/persistence/vector/·手写领地·生成器不覆写）。
# 真源声明在 .ingest/metarch.json（storage.kind=vector 便签：表名/维度/索引/距离/嵌入模型）——
# 此处只放连接与端点等运行时环境参数（真源≠环境）。
vector {
  pg {
    driver = "org.postgresql.Driver"
    # metarch-pg 容器（compose 同源：宿主 5433 → 容器 5432·PG16+pgvector 0.8）
    url = "jdbc:postgresql://127.0.0.1:5433/postgres"
    user = "postgres"
    # 本机开发默认口令（compose 先例）；部署/CI 用 PG_PASSWORD 环境变量覆写
    password = "1q2w3e4r5t"
    password = ${?PG_PASSWORD}
    connect-timeout = 5s
    socket-timeout = 30s
    # 向量列名（真源 storage.embeddingColumn 同值·search ORDER BY 用；批C 生成契约不含该参数故走配置）
    embedding-column = "embedding"
  }
  embedding {
    # Ollama bge-m3（1024 维·中英双语跨语检索）——与真源 storage.embedding 同值
    endpoint = "http://localhost:11434/api/embed"
    model = "bge-m3"
    dims = 1024
    timeout = 30s
  }
}
