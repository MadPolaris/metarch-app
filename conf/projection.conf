akka {

   projection {
     jdbc.blocking-jdbc-dispatcher.thread-pool-executor.fixed-pool-size = 10
     jdbc.dialect = mysql-dialect
   }

}

jdbc-connection-settings {
  driver = "com.mysql.jdbc.Driver"
  # S2-81 批E（2026-09-10）：sessionVariables 锁定 READ-COMMITTED——投影 offset store 并发写在
  # REPEATABLE-READ 下走 gap lock → 启动突发死锁螺旋（27 条流 Failed to process envelope/Projection will stop）。
  # 此前靠 docker 内 SET GLOBAL 缓解，但容器重启即回退（实证 2026-09-10 晨批E replay 三连失败根因）。
  url = "jdbc:mysql://127.0.0.1:3308/cqrs_jdbc_demo?allowPublicKeyRetrieval=true&noAccessToProcedureBodies=true&createDatabaseIfNotExist=true&m=yes&characterEncoding=UTF-8&connectTimeout=300000&useSSL=false&serverTimezone=UTC&socketTimeout=30000&autoReconnect=true&maxReconnects=10&initialTimeout=10&sessionVariables=transaction_isolation=%27READ-COMMITTED%27"
  user = "root"
  password = "1q2w3e4r5t"

    # the following properties are used to configure the
    # Hikari connection pool used on the read-side (akka-projections)
    connection-pool {
      # How many connections should be available to from the pool?
      # it's recommended to use the same value used by the blocking-jdbc-dispatcher (see above)
      max-pool-size = ${akka.projection.jdbc.blocking-jdbc-dispatcher.thread-pool-executor.fixed-pool-size}

      # How long should we wait (in millis) before it times out?
      # S2-8 调试结论（2026-08-23）：250ms 在容器代理路径 + 投影重启风暴下必然超时，
      # 形成死锁螺旋（27 条流 × 无限 backoff → 线程耗尽 EACCES）。放宽到 5s。
      timeout = 5000ms
    }
}

scalikejdbc.global {
  loggingSQLAndTime.enabled=false
  loggingSQLAndTime.singleLineMode=false
  loggingSQLAndTime.logLevel=debug
  loggingSQLAndTime.warningEnabled=true
  loggingSQLAndTime.warningThresholdMillis=5
  loggingSQLAndTime.warningLogLevel=warn
}