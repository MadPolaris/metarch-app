akka {
   actor {
     serialization-identifiers {
       "net.imadz.infra.saga.serialization.SagaSerializer" = 1235
       "net.imadz.common.serialization.ScalaPbSerializer" = 1236
     }
     serializers {
        jackson-json = "akka.serialization.jackson.JacksonJsonSerializer"
        jackson-cbor = "akka.serialization.jackson.JacksonCborSerializer"
        object-id-offset = "net.imadz.common.serialization.ObjectIdOffsetSerializer"
        # 保留：镜像 Akka 自带绑定（Akka 线协议用的 `com.google.protobuf.Message`）。
        # 本仓 app 侧零实现者，但删掉会把该绑定交回 reference 默认——无收益、有风险，故留。
        proto = "akka.remote.serialization.ProtobufSerializer"
        scalapb-proto = "net.imadz.common.serialization.ScalaPbSerializer"
        saga-serializer = "net.imadz.infra.saga.serialization.SagaSerializer"
     }
     serialization-bindings {
       "akka.contrib.persistence.mongodb.ObjectIdOffset" = object-id-offset
       "com.google.protobuf.Message" = proto
       # ScalaPB 事件走 protobuf（可 schema 演进）。**不可用内建 `proto`**——实验实证（2026-09-23）：
       # 绑 `GeneratedOneof = proto` → `ProtobufSerializer.toBinary` 反射找 `toByteArray()` →
       # `NoSuchMethodException: UserEventPO$Event$UserRegistered.toByteArray()` → WriteMessageRejected。
       # 故须自写 `ScalaPbSerializer`（拆 oneof 的 `value` 内层）。`scalapb.GeneratedMessage` 本可用内建，
       # 但统一走自写件（同一处兼容垫片管理·回放路径按类选序列化器时需 Java 回退）。
       "scalapb.GeneratedMessage" = scalapb-proto
       "scalapb.GeneratedOneof" = scalapb-proto
       "net.imadz.common.CborSerializable" = jackson-cbor
       "net.imadz.infra.saga.StepExecutor$OperationResponse" =  saga-serializer
       "net.imadz.infra.saga.StepExecutor$OperationSucceeded" =  saga-serializer
     }
     # 2026-09-23（EP_Serialization_Architecture_Compliance·用户令）：**Java 序列化全禁**。
     # 违背 = 架构违规（事件一律走 proto PO）。off 后 JavaSerializer 被换成 DisabledJavaSerializer
     # ——任何仍在走 Java 的路径会**响亮地炸**（这既是验收判据、也是长期护栏）。
     # 存量 5658 条 Java 事件已随清空重灌退场；`ScalaPbSerializer` 的 Java 回退垫片保留一轮观察再撤。
     allow-java-serialization = off
     warn-about-java-serializer-usage = on
   }

}