akka {
  persistence {
    journal.plugin = "akka-contrib-mongodb-persistence-journal"
	snapshot-store.plugin = "akka-contrib-mongodb-persistence-snapshot"
  }
  # 宿主运行默认走端口代理(127.0.0.1)；容器内运行设 MONGO_URI=mongodb://<mongo容器名或IP>:27017/... 覆写
  # BUG-012 缓解（α/FIX-BUG-012）：现役驱动为 ReactiveMongo（双 jar 类路径裁决 + 运行日志实证），
  # 其连接池/套接字参数只认 URI，不读 official.* 键。maxIdleTimeMS=120000 使 Netty IdleStateHandler
  # 在读空闲 120s 时关闭半死通道 → 挂起的 tailable getMore 被 retryAwaitingOnError 重试或失败，
  # 静默冻结转为可自愈（重试成功则游标续传；失败则流报错走 projection backoff 重建）。
  # 取值依据：≥heartbeatFrequencyMS(默认10s) 合法；≪mongod cursorTimeoutMillis 默认600s，
  # 重试时服务端游标仍存活，尾巴无缝续传。MONGO_URI 覆写时须自带该参数。
  contrib.persistence.mongodb.mongo.mongouri = "mongodb://127.0.0.1:27017/cqrs-demo-journal?w=majority&authSource=admin&maxIdleTimeMS=120000"
  contrib.persistence.mongodb.mongo.mongouri = ${?MONGO_URI}
  contrib.persistence.mongodb.mongo.suffix-builder.separator = "_"
  # BUG-012 加固（Squad-A，保留）：以下 official.* 键仅对 ScalaDriverPersistenceExtension 生效
  # （ScalaDriverSettings 读 akka.contrib.persistence.mongodb.official）；当前现役驱动为 ReactiveMongo，
  # 这两行暂不起作用，留作未来切换官方驱动时的等价加固。原注释「驱动以 maxAwaitTime=30s 覆写
  # getMore」经源码核实不实（DefaultCursor maxAwaitTimeMs=None，插件未设置该值）。
  contrib.persistence.mongodb.mongo.official.maxidletime = 120seconds
  contrib.persistence.mongodb.mongo.official.sockettimeout = 90seconds
  # suffix-builder.class 缺省空串 = 无后缀集合模式；不依赖 SuffixCollectionNames 实现
}
