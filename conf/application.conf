# https://www.playframework.com/documentation/latest/Configuration
include "projection.conf"
include "persistence.conf"
include "serialization.conf"
include "cluster.conf"
include "vector.conf"

akka {
  extensions += "net.imadz.common.serialization.SerializationExtension"
  loglevel = DEBUG
}

play.modules.enabled += "net.imadz.modules.BootstrapModule"
play.modules.enabled += "scalikejdbc.PlayModule"
play.modules.disabled += "play.api.db.DBModule"
play.modules.enabled += "controllers.filter.CommandAuditModule"
play.modules.enabled += "net.imadz.modules.KnInstanceProjectionModule"
play.modules.enabled += "net.imadz.modules.KnJournalModule"
play.modules.enabled += "net.imadz.modules.PolicyProjectionModule"
play.modules.enabled += "net.imadz.modules.ProjectionTailWatchdogModule"
play.filters.enabled=[controllers.filter.LoggingFilter, controllers.filter.CommandAuditFilter, "play.filters.cors.CORSFilter"]
play.filters.cors {
  allowedOrigins = ["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS", "HEAD"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Origin", "X-User", "Authorization"]
  preflightMaxAge = 600 seconds
}
play.server.websocket.periodic-keep-alive-max-idle = 10 seconds

play.temporaryFile {
  reaper {
    enabled = true
    initialDelay = "5 minutes"
    interval = "30 seconds"
    olderThan = "30 minutes"
  }
}

# 认证（Authentication_Design.md §一）
auth {
  secret = "dev-only-secret-metarch-0123456789abcdef-0123456789abcdef"
  secret = ${?AUTH_SECRET}
  accessTtlSeconds = 14400 # 4h（2026-08-27 用户拍板：原 15min，Postman/前端联调友好）
  refreshTtlSeconds = 2592000
  # S2-87 WP-D（2026-09-13）：migration→enforce——角色不符 403 ROLE_REQUIRED（登录已烧 mrole·WP-C）。
  # 例外面：TenantOwner 至上（Endpoint.toTenant 代码级·生命周期域 Owner 管理拍板）；
  # 残留空 mrole token（切换前签发）最长 4h 过渡期内对声明角色命令 403——重登即愈。
  roleGate.mode = enforce
}

# 图租户隔离（EP_KnowledgePatch_Tenant_Isolation.md）
# 2026-08-27 由 warn 切 strict：存量缺戳已清除（13 测试残留）、复合 UNIQUENESS 约束已 live（7 label）、
# mappings 全事件 PO 已带 tenantId ⇒ 缺戳 fail-fast（MissingTenantStampException）
graph.tenant.enforcement = strict
# required-labels 缺省即 7 个租户作用域 label（Concept/Catalog/Context/Subdomain/ContextRelationNode/Note/Question）。
# 服务图完整性批（2026-09-29·形态B）：显式声明 8 个——Field 入强制清单（字段节点带 tenantId 戳·strict 门同权）
# 回锚面对齐批（2026-09-30·判例#18 后续）：CodeAnchor 入强制清单（S5 旁路 upsertOne 全带 tenantId 戳·
#   CodeAnchorApiController.scala:7 声明 ③ 与本清单对齐——此前注释宣称、清单缺项的文档漂移已闭）
graph.tenant.required-labels = ["Concept", "Catalog", "Context", "Subdomain", "ContextRelationNode", "Note", "Question", "Field", "CodeAnchor"]

# Neo4j 连接（S2-33·2026-09-03：口令退役出代码——原硬编码已入 git 历史请轮换）
# 取值：本段 conf > 环境变量 NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD > uri/user 缺省
# password 无缺省：未配置时图操作 fail-fast（GraphConnectionConfig 指引异常）
graph.neo4j {
  uri = "bolt://127.0.0.1:7687"
  user = "neo4j"
  password = ${?NEO4J_PASSWORD}
}




# Play 生产模式启动密钥（stage 脱树启动必需；与 auth.secret 同族 dev 值，生产经 AUTH_SECRET/play.http.secret.key 环境覆盖）
play.http.secret.key = "dev-only-secret-metarch-0123456789abcdef-0123456789abcdef"

# S2-81 批5：s77 真源数据面（S77TruthController）——真源根目录
# 取值优先级：本 conf > 环境变量 S77_TRUTH_ROOT > 缺省 ../backend-codegen（相对服务进程工作目录）
# 服务侧只读指纹＋原始字节，派生计算在 9077（协议见 backend-codegen design_docs/s281_s77_9000_dataplane.md）
# B4c：真源 payload 灌入通道上限（metarch-fieldmodel 193KB > Play 缺省 100KB）
play.http.parser.maxMemoryBuffer = 2MB

s77.truth.root = "../backend-codegen"

# S2-82-B4b：真源键投影读切源——列出的键 /api/truth/:key 字节改由投影重建（canonical JSON·TruthProjectionRebuilder）
# 取值优先级：本 conf > 环境变量 S77_TRUTH_PROJECTION_KEYS（逗号分隔） > 缺省空集（全 file——回滚＝注释本行重启）
# 前置门：tools/s77/truth_projection_gate.mjs（服务重建字节 vs 文件字节 canonical diff=0）＋truth_recon 七键全绿
# WP4 切源启用（2026-09-11·truth_recon 七键全绿＋2301 测试门过）：
s77.truth.projection-keys = ["fields-template", "readmodels", "cem", "role-command-map", "metarch"]

